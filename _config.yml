# Site settings — edit these three first.
title: Halil Akgündüz
description: Notes and short stories.
substack_url: "https://broccolipancakes.substack.com"   # newsletter for the footer signup
buttondown_username: ""   # alternative: used only if substack_url is empty

url: "https://hakgunduz.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true   # single line breaks behave like they do in Obsidian

collections:
  notes:
    output: true
    permalink: /notes/:slug/
  stories:
    output: true
    permalink: /stories/:slug/
  articles:
    output: true
    permalink: /articles/:slug/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: notes }
    values: { layout: entry, kind: Note }
  - scope: { path: "", type: stories }
    values: { layout: entry, kind: Story }
  - scope: { path: "", type: articles }
    values: { layout: entry, kind: Article }

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - Templates
  - vendor
