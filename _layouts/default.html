<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply a saved theme before the page paints, so there is no flash.
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      {% assign section = page.url | split: '/' | slice: 1 | first %}
      <a href="{{ '/notes/' | relative_url }}"{% if section == 'notes' %} aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/stories/' | relative_url }}"{% if section == 'stories' %} aria-current="page"{% endif %}>Stories</a>
      <a href="{{ '/about/' | relative_url }}"{% if section == 'about' %} aria-current="page"{% endif %}>About</a>
      <button class="theme-toggle" type="button" aria-label="Switch theme" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    {% include subscribe.html %}
    <p class="fine">© {{ 'now' | date: '%Y' }} {{ site.title }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.querySelector(".theme-toggle");
      var system = window.matchMedia("(prefers-color-scheme: dark)");
      function current() { return root.dataset.theme || (system.matches ? "dark" : "light"); }
      function label() {
        button.setAttribute("aria-label", current() === "dark" ? "Switch to light theme" : "Switch to dark theme");
      }
      button.hidden = false;
      label();
      button.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      system.addEventListener("change", label);
    })();
  </script>
</body>
</html>
